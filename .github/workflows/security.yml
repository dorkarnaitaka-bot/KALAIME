name: Dependency security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: SPDX SBOM and Grype / Ubuntu 26.04
    runs-on: ubuntu-26.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKG_MAX_CONCURRENCY: 2
      CC: clang-23
      CXX: clang++-23
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect Ubuntu platform
        id: platform
        run: |
          source /etc/os-release
          [[ "${ID}" == ubuntu ]]
          architecture="$(dpkg --print-architecture)"
          printf 'platform=%s-%s-%s\n' "${ID}" "${VERSION_ID}" "${architecture}" >> "$GITHUB_OUTPUT"

      - name: Restore Clang toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: |
            ~/.local/opt/LLVM-23.1.5-Linux-X64
            ~/.local/bin/cmake
            ~/.local/bin/ctest
            ~/.local/bin/cpack
            ~/.local/bin/ninja
            ~/.local/share/cmake-4.5
          key: kalaime-toolchain-v3-${{ steps.platform.outputs.platform }}-clang-23.1.5-cmake-4.5.0-ninja-1.13.2-${{ hashFiles('scripts/install-llvm-23-ubuntu.sh', 'scripts/install-linux-build-tools.sh') }}

      - name: Restore vcpkg source cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg-downloads
          key: kalaime-vcpkg-downloads-v1-${{ steps.platform.outputs.platform }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore pinned vcpkg checkout
        id: vcpkg-root-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg
          key: kalaime-vcpkg-root-v1-${{ steps.platform.outputs.platform }}-0df93a05b9de080129e653ec4776d7e14a1b2e4f

      - name: Install build prerequisites
        run: |
          packages=(git curl zip unzip tar zstd pkg-config python3 make)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "${package}" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("${package}")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          KALAIME_REPAIR_CACHED_TOOLCHAINS=1 scripts/install-llvm-23-ubuntu.sh
          scripts/install-linux-build-tools.sh
          export PATH="$HOME/.local/bin:$PATH"
          clang-23 --version | grep -F '23.1.5'
          clang++-23 --version | grep -F '23.1.5'
          clang-format-23 --version | grep -F '23.1.5'
          clang-tidy-23 --version | grep -F '23.1.5'
          clangd-23 --version | grep -F '23.1.5'
          lld-23 --version | grep -F '23.1.5'
          ld.lld-23 --version | grep -F '23.1.5'
          llvm-ar-23 --version | grep -F '23.1.5'
          llvm-ranlib-23 --version | grep -F '23.1.5'
          cmake --version | grep -Fx 'cmake version 4.5.0'
          ninja --version | grep -Fx '1.13.2'

      - name: Save Clang toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: |
            ~/.local/opt/LLVM-23.1.5-Linux-X64
            ~/.local/bin/cmake
            ~/.local/bin/ctest
            ~/.local/bin/cpack
            ~/.local/bin/ninja
            ~/.local/share/cmake-4.5
          key: kalaime-toolchain-v3-${{ steps.platform.outputs.platform }}-clang-23.1.5-cmake-4.5.0-ninja-1.13.2-${{ hashFiles('scripts/install-llvm-23-ubuntu.sh', 'scripts/install-linux-build-tools.sh') }}

      - name: Install SBOM and vulnerability tools
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned vcpkg
        shell: bash
        run: |
          baseline=0df93a05b9de080129e653ec4776d7e14a1b2e4f
          cached_commit="$(git -C "$VCPKG_ROOT" rev-parse HEAD 2>/dev/null || true)"
          if [[ "$cached_commit" == "$baseline" &&
                -x "$VCPKG_ROOT/vcpkg" &&
                -z "$(git -C "$VCPKG_ROOT" status --porcelain --untracked-files=no)" ]] &&
             "$VCPKG_ROOT/vcpkg" version >/dev/null 2>&1; then
            echo "Reusing verified vcpkg checkout at $cached_commit."
          else
            if [[ -e "$VCPKG_ROOT" || -L "$VCPKG_ROOT" ]]; then
              echo "Cached vcpkg checkout is incomplete or at the wrong commit; replacing it."
              rm -rf -- "$VCPKG_ROOT"
            fi
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
            git -C "$VCPKG_ROOT" checkout --detach "$baseline"
            CC=clang-23 CXX=clang++-23 "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          [[ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" == "$baseline" ]]
          "$VCPKG_ROOT/vcpkg" version

      - name: Save pinned vcpkg checkout
        if: steps.vcpkg-root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg
          key: kalaime-vcpkg-root-v1-${{ steps.platform.outputs.platform }}-0df93a05b9de080129e653ec4776d7e14a1b2e4f

      - name: Resolve manifest dependencies
        run: cmake --preset ubuntu-ci

      - name: Save vcpkg source cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg-downloads
          key: kalaime-vcpkg-downloads-v1-${{ steps.platform.outputs.platform }}-${{ hashFiles('vcpkg.json') }}

      - name: Generate SPDX SBOM and scan with Grype
        run: scripts/security-scan-ubuntu.sh build/ubuntu-ci

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-sbom-and-grype-report
          path: |
            build/ubuntu-ci/spdx/*.spdx.json
            build/ubuntu-ci/grype-report.txt
          if-no-files-found: warn
          retention-days: 30
