name: Ubuntu CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang:
    name: Clang 18 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 clang-tidy-18 clangd-18 clang-format-18 \
            cmake ninja-build git curl zip unzip tar pkg-config python3

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-ci

      - name: Build
        run: cmake --build --preset ubuntu-ci --parallel 1

      - name: Check clang-format
        run: scripts/check-format-ubuntu.sh

      - name: Run clang-tidy
        run: scripts/check-tidy-ubuntu.sh build/ubuntu-ci

      - name: Run CTest
        run: ctest --preset ubuntu-ci

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ubuntu-clang-ctest
          path: build/ubuntu-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  gcc:
    name: GCC / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git curl zip unzip tar pkg-config python3

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-gcc-ci

      - name: Build
        run: cmake --build --preset ubuntu-gcc-ci --parallel 1

      - name: Run CTest
        run: ctest --preset ubuntu-gcc-ci
