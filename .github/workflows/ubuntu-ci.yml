name: Ubuntu CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang:
    name: Clang 23 / Ubuntu 26.04
    runs-on: ubuntu-26.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKG_MAX_CONCURRENCY: 2
      CC: clang-23
      CXX: clang++-23
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect Ubuntu platform
        id: platform
        run: |
          source /etc/os-release
          [[ "${ID}" == ubuntu ]]
          architecture="$(dpkg --print-architecture)"
          printf 'platform=%s-%s-%s\n' "${ID}" "${VERSION_ID}" "${architecture}" >> "$GITHUB_OUTPUT"

      - name: Restore Clang toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: |
            ~/.local/opt/LLVM-23.1.5-Linux-X64
            ~/.local/bin/cmake
            ~/.local/bin/ctest
            ~/.local/bin/cpack
            ~/.local/bin/ninja
            ~/.local/share/cmake-4.5
          key: kalaime-toolchain-v3-${{ steps.platform.outputs.platform }}-clang-23.1.5-cmake-4.5.0-ninja-1.13.2-${{ hashFiles('scripts/install-llvm-23-ubuntu.sh', 'scripts/install-linux-build-tools.sh') }}

      - name: Restore vcpkg source cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg-downloads
          key: kalaime-vcpkg-downloads-v1-${{ steps.platform.outputs.platform }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore pinned vcpkg checkout
        id: vcpkg-root-cache
        uses: actions/cache/restore@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg
          key: kalaime-vcpkg-root-v1-${{ steps.platform.outputs.platform }}-0df93a05b9de080129e653ec4776d7e14a1b2e4f

      - name: Install build and analysis tools
        run: |
          packages=(git curl zip unzip tar zstd pkg-config python3 make)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "${package}" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("${package}")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          KALAIME_REPAIR_CACHED_TOOLCHAINS=1 scripts/install-llvm-23-ubuntu.sh
          scripts/install-linux-build-tools.sh
          export PATH="$HOME/.local/bin:$PATH"
          clang-23 --version | grep -F '23.1.5'
          clang++-23 --version | grep -F '23.1.5'
          clang-format-23 --version | grep -F '23.1.5'
          clang-tidy-23 --version | grep -F '23.1.5'
          clangd-23 --version | grep -F '23.1.5'
          lld-23 --version | grep -F '23.1.5'
          ld.lld-23 --version | grep -F '23.1.5'
          llvm-ar-23 --version | grep -F '23.1.5'
          llvm-ranlib-23 --version | grep -F '23.1.5'
          llvm-readobj-23 --version | grep -F '23.1.5'
          cmake --version | grep -Fx 'cmake version 4.5.0'
          ninja --version | grep -Fx '1.13.2'

      - name: Save Clang toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: |
            ~/.local/opt/LLVM-23.1.5-Linux-X64
            ~/.local/bin/cmake
            ~/.local/bin/ctest
            ~/.local/bin/cpack
            ~/.local/bin/ninja
            ~/.local/share/cmake-4.5
          key: kalaime-toolchain-v3-${{ steps.platform.outputs.platform }}-clang-23.1.5-cmake-4.5.0-ninja-1.13.2-${{ hashFiles('scripts/install-llvm-23-ubuntu.sh', 'scripts/install-linux-build-tools.sh') }}

      - name: Install pinned vcpkg
        shell: bash
        run: |
          baseline=0df93a05b9de080129e653ec4776d7e14a1b2e4f
          cached_commit="$(git -C "$VCPKG_ROOT" rev-parse HEAD 2>/dev/null || true)"
          if [[ "$cached_commit" == "$baseline" &&
                -x "$VCPKG_ROOT/vcpkg" &&
                -z "$(git -C "$VCPKG_ROOT" status --porcelain --untracked-files=no)" ]] &&
             "$VCPKG_ROOT/vcpkg" version >/dev/null 2>&1; then
            echo "Reusing verified vcpkg checkout at $cached_commit."
          else
            if [[ -e "$VCPKG_ROOT" || -L "$VCPKG_ROOT" ]]; then
              echo "Cached vcpkg checkout is incomplete or at the wrong commit; replacing it."
              rm -rf -- "$VCPKG_ROOT"
            fi
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
            git -C "$VCPKG_ROOT" checkout --detach "$baseline"
            CC=clang-23 CXX=clang++-23 "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          [[ "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" == "$baseline" ]]
          "$VCPKG_ROOT/vcpkg" version

      - name: Save pinned vcpkg checkout
        if: steps.vcpkg-root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg
          key: kalaime-vcpkg-root-v1-${{ steps.platform.outputs.platform }}-0df93a05b9de080129e653ec4776d7e14a1b2e4f

      - name: Configure
        run: cmake --preset ubuntu-ci

      - name: Save vcpkg source cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4.2.4
        continue-on-error: true
        with:
          path: .vcpkg-downloads
          key: kalaime-vcpkg-downloads-v1-${{ steps.platform.outputs.platform }}-${{ hashFiles('vcpkg.json') }}

      - name: Verify Clang and LLD selection
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shlex
          import shutil
          import subprocess

          build_dir = pathlib.Path("build/ubuntu-ci")
          cache_lines = (build_dir / "CMakeCache.txt").read_text().splitlines()
          cache = {}
          for line in cache_lines:
              if ":" in line and "=" in line and not line.startswith("//"):
                  name, value = line.split("=", 1)
                  cache[name.split(":", 1)[0]] = value
          for key, tool in (("CMAKE_C_COMPILER", "clang-23"),
                            ("CMAKE_CXX_COMPILER", "clang++-23")):
              tool_path = shutil.which(tool)
              assert tool_path, f"{tool} is not on PATH"
              expected = pathlib.Path(tool_path).resolve(strict=True)
              actual = pathlib.Path(cache[key]).resolve(strict=True)
              assert actual == expected, f"{key} selected {actual}, expected {expected}"
              version = subprocess.check_output([str(actual), "--version"], text=True)
              assert "23.1.5" in version, f"Unexpected {tool} version: {version}"
          assert "-fuse-ld=lld" in cache["CMAKE_EXE_LINKER_FLAGS"], (
              f"LLD is not configured: {cache['CMAKE_EXE_LINKER_FLAGS']}"
          )
          assert shutil.which("ld.lld-23"), "Versioned LLD executable is not on PATH"

          commands = json.loads((build_dir / "compile_commands.json").read_text())
          assert commands, "compile_commands.json contains no commands"
          expected_cxx = pathlib.Path(shutil.which("clang++-23")).resolve(strict=True)
          for entry in commands:
              argv = entry.get("arguments") or shlex.split(entry["command"])
              actual_name = argv[0]
              actual_path = pathlib.Path(actual_name)
              if not actual_path.is_absolute():
                  actual_name = shutil.which(actual_name)
                  assert actual_name, f"Compile command compiler is not on PATH: {argv[0]}"
                  actual_path = pathlib.Path(actual_name)
              actual = actual_path.resolve(strict=True)
              assert actual == expected_cxx, f"Compile command uses {actual}, expected {expected_cxx}"
          PY

      - name: Build
        run: cmake --build --preset ubuntu-ci --parallel 1

      - name: Check clang-format
        run: scripts/check-format-ubuntu.sh

      - name: Run clang-tidy
        run: scripts/check-tidy-ubuntu.sh build/ubuntu-ci

      - name: Run CTest
        run: ctest --preset ubuntu-ci

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ubuntu-clang-ctest
          path: build/ubuntu-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
